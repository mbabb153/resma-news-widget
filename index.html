<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESMA Industry News Feed</title>
<style>
  :root {
    --title-color: #2e7ec8;
    --text-color: #505659;
    --bg-color: #ffffff;
    --border-color: #e5e5e5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
  }
  #feed-container {
    width: 100%;
    height: 100%;
    min-height: 150px;
    overflow-y: auto;
    padding: 0 20px;
  }
  .feed-item {
    padding: 16px 0;
    border-bottom: 1px solid var(--border-color);
  }
  .feed-item:last-child { border-bottom: none; }
  .feed-item-title {
    font-size: 18px;
    font-weight: normal;
    margin: 0 0 6px 0;
    line-height: 1.3;
  }
  .feed-item-title a {
    color: var(--title-color);
    text-decoration: none;
  }
  .feed-item-title a:hover { text-decoration: underline; }
  .feed-item-content {
    font-size: 16px;
    line-height: 1.4;
    margin: 0 0 8px 0;
    color: var(--text-color);
  }
  .feed-item-meta {
    font-size: 12px;
    color: #505659;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .feed-item-source { font-weight: 600; }
  .feed-item-date { color: #8a8f92; }
  .read-more {
    font-size: 12px;
    color: var(--title-color);
    text-decoration: none;
    margin-left: auto;
  }
  .read-more:hover { text-decoration: underline; }
  .loading, .error, .empty {
    padding: 30px 0;
    text-align: center;
    color: #8a8f92;
    font-size: 14px;
  }
  .error { color: #b03030; }
  .retry-btn {
    margin-top: 10px;
    padding: 6px 14px;
    font-size: 13px;
    color: #fff;
    background: var(--title-color);
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="feed-container">
  <div class="loading">Loading industry news&hellip;</div>
</div>

<script>
(function () {
  // ---- Configuration ---------------------------------------------------
  var FEEDS = [
    "https://variety.com/v/business/feed/",
    "https://www.hollywoodreporter.com/c/business-news/feed/",
    "https://sportico.com/feed/",
    "https://www.gamesindustry.biz/feed",
    "https://www.musicbusinessworldwide.com/feed/",
    "https://www.adweek.com/feed/"
  ];

  var MAX_PER_FEED = 20;     // raw items pulled from each source before filtering
  var MAX_PER_SOURCE_DISPLAYED = 3; // most recent items shown per source, after filtering
  var MAX_TOTAL = 30;        // hard ceiling on total items shown
  var TITLE_MAX_CHARS = 100;
  var CONTENT_MAX_CHARS = 200;
  var CONTENT_SOURCE_LABEL = "title"; // "title" or "domain"
  var FETCH_TIMEOUT_MS = 6000;   // per-proxy timeout (raced, not queued)
  var CACHE_TTL_MS = 10 * 60 * 1000; // 10 minutes

  // Items whose title or content contain any of these terms (case-insensitive)
  // are dropped before rendering. Keeps the feed focused on business/industry
  // news and filters out celebrity gossip, lifestyle, and clickbait content.
  var EXCLUDE_KEYWORDS = [
    "dating", "dating rumors", "romance", "romantic", "boyfriend", "girlfriend",
    "fiancé", "fiance", "fiancée", "husband", "wife", "divorce", "breakup",
    "breaks up", "split", "relationship", "relationship rumors", "pregnant",
    "pregnancy", "baby bump", "expecting a baby", "welcomes baby", "new baby",
    "wedding", "engaged", "engagement", "married", "marriage", "honeymoon",
    "family drama", "feud", "celebrity feud", "beef", "clapback", "slams",
    "fires back", "responds to", "breaks silence", "speaks out", "shades",
    "shade", "disses", "diss", "rumor", "rumors", "rumoured", "rumored",
    "gossip", "scandal", "controversy", "viral moment", "goes viral",
    "viral video", "fans react", "fan reaction", "fans think", "internet reacts",
    "social media reacts", "tiktok reacts", "instagram post", "instagram photo",
    "selfie", "photos", "photo dump", "red carpet", "best dressed",
    "worst dressed", "outfit", "fashion look", "wardrobe", "makeup",
    "hair transformation", "transformation", "weight loss", "bikini",
    "swimsuit", "shirtless", "steamy", "sexy", "reveals", "revealed",
    "secret", "confession", "confesses", "inside their", "inside look",
    "inside romance", "what happened between", "why they broke up",
    "who is dating", "who is", "meet the", "everything to know about",
    "things to know", "you won't believe", "shocking", "stuns", "stunned",
    "jaw-dropping", "awkward", "embarrassing", "cringe", "wild reaction",
    "celebrity sighting", "spotted with", "seen with", "pda", "kiss",
    "kissing", "love life", "ex-boyfriend", "ex-girlfriend", "ex-husband",
    "ex-wife", "ex review", "recap", "episode recap", "ending explained",
    "explained", "spoilers", "spoiler", "trailer", "teaser trailer",
    "first look", "poster", "gallery", "ranking", "ranked", "best movies",
    "best shows", "best songs", "best albums", "playlist", "watch",
    "where to watch", "how to watch", "release date", "cast",
    "casting rumors", "fan theory", "theory", "predictions", "who won",
    "winner", "winners", "awards fashion", "gift guide", "shopping",
    "shop", "sale", "deals", "discount", "coupon", "what to buy"
  ];

  // CORS proxies. All are fired at once per feed; whichever responds
  // first wins, so a slow/dead proxy no longer blocks the others.
  var PROXIES = [
    function (url) { return "https://api.allorigins.win/raw?url=" + encodeURIComponent(url); },
    function (url) { return "https://corsproxy.io/?url=" + encodeURIComponent(url); },
    function (url) { return "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url); }
  ];

  var container = document.getElementById("feed-container");

  function cacheGet(key) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (Date.now() - parsed.t > CACHE_TTL_MS) return null;
      return parsed.v;
    } catch (e) { return null; }
  }

  function cacheSet(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify({ t: Date.now(), v: value }));
    } catch (e) { /* storage full or unavailable, ignore */ }
  }

  function truncate(str, max) {
    if (!str) return "";
    str = str.replace(/\s+/g, " ").trim();
    if (str.length <= max) return str;
    return str.slice(0, max).trim() + "…";
  }

  function stripHtml(html) {
    var tmp = document.createElement("div");
    tmp.innerHTML = html || "";
    return tmp.textContent || tmp.innerText || "";
  }

  function formatDate(dateStr) {
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  // Build one combined whole-word regex from the exclude list, so terms
  // like "cast" or "watch" don't false-match inside "forecast"/"watchdog".
  var EXCLUDE_REGEX = new RegExp(
    "\\b(" + EXCLUDE_KEYWORDS.map(escapeRegex).join("|") + ")\\b",
    "i"
  );

  function isExcluded(item) {
    var haystack = (item.title || "") + " " + (item.content || "");
    return EXCLUDE_REGEX.test(haystack);
  }

  function fetchWithTimeout(url, ms) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, ms);
    return fetch(url, { signal: controller.signal }).finally(function () {
      clearTimeout(timer);
    });
  }

  function fetchOneProxy(targetUrl, proxyIndex) {
    var proxyUrl = PROXIES[proxyIndex](targetUrl);
    return fetchWithTimeout(proxyUrl, FETCH_TIMEOUT_MS)
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (text) {
        if (!text || text.length < 20) throw new Error("Empty response");
        return text;
      })
      .catch(function (err) {
        console.warn("Proxy " + proxyIndex + " failed for " + targetUrl + ":", err.message || err);
        throw err; // rethrow so Promise.any treats it as a rejection
      });
  }

  function fetchViaProxies(targetUrl) {
    // Fire every proxy at once; take whichever succeeds first.
    var attempts = PROXIES.map(function (_, i) { return fetchOneProxy(targetUrl, i); });
    if (typeof Promise.any === "function") {
      return Promise.any(attempts).catch(function () {
        throw new Error("All proxies failed for " + targetUrl);
      });
    }
    // Fallback for older browsers without Promise.any
    return new Promise(function (resolve, reject) {
      var remaining = attempts.length;
      attempts.forEach(function (p) {
        p.then(resolve).catch(function () {
          remaining--;
          if (remaining === 0) reject(new Error("All proxies failed for " + targetUrl));
        });
      });
    });
  }

  function parseFeed(xmlText, feedUrl) {
    var items = [];
    try {
      var doc = new DOMParser().parseFromString(xmlText, "text/xml");
      if (doc.querySelector("parsererror")) return items;

      var rssItems = doc.querySelectorAll("item");
      var atomEntries = doc.querySelectorAll("entry");

      var sourceTitleEl = doc.querySelector("channel > title") || doc.querySelector("feed > title");
      var sourceTitle = sourceTitleEl ? sourceTitleEl.textContent.trim() : new URL(feedUrl).hostname.replace(/^www\./, "");

      if (rssItems.length) {
        rssItems.forEach(function (item) {
          var title = item.querySelector("title") ? item.querySelector("title").textContent : "";
          var link = item.querySelector("link") ? item.querySelector("link").textContent : "";
          var pubDate = item.querySelector("pubDate") ? item.querySelector("pubDate").textContent : "";
          var descEl = item.querySelector("description");
          var description = descEl ? descEl.textContent : "";
          items.push({
            title: title,
            link: link,
            pubDate: pubDate,
            content: stripHtml(description),
            source: sourceTitle
          });
        });
      } else if (atomEntries.length) {
        atomEntries.forEach(function (entry) {
          var title = entry.querySelector("title") ? entry.querySelector("title").textContent : "";
          var linkEl = entry.querySelector("link");
          var link = linkEl ? (linkEl.getAttribute("href") || linkEl.textContent) : "";
          var pubDate = entry.querySelector("updated") ? entry.querySelector("updated").textContent :
                        (entry.querySelector("published") ? entry.querySelector("published").textContent : "");
          var summaryEl = entry.querySelector("summary") || entry.querySelector("content");
          var description = summaryEl ? summaryEl.textContent : "";
          items.push({
            title: title,
            link: link,
            pubDate: pubDate,
            content: stripHtml(description),
            source: sourceTitle
          });
        });
      }
    } catch (e) {
      console.error("Failed to parse feed:", feedUrl, e);
    }
    return items.slice(0, MAX_PER_FEED);
  }

  function fetchFeed(url) {
    var cacheKey = "resma_feed_" + url;
    var cached = cacheGet(cacheKey);
    if (cached) return Promise.resolve(cached);

    return fetchViaProxies(url)
      .then(function (text) {
        var items = parseFeed(text, url);
        cacheSet(cacheKey, items);
        return items;
      })
      .catch(function (err) {
        console.error("Feed failed entirely:", url, err.message || err);
        return [];
      });
  }

  function render(items) {
    if (!items.length) {
      container.innerHTML =
        '<div class="empty">No news items available right now.' +
        '<br><button class="retry-btn" onclick="location.reload()">Retry</button></div>';
      return;
    }

    var html = "";
    items.slice(0, MAX_TOTAL).forEach(function (item) {
      var sourceLabel = CONTENT_SOURCE_LABEL === "domain"
        ? (item.link ? new URL(item.link).hostname.replace(/^www\./, "") : item.source)
        : item.source;

      html += '<div class="feed-item">';
      html += '<h3 class="feed-item-title"><a href="' + item.link + '" target="_blank" rel="noopener noreferrer">' +
              truncate(item.title, TITLE_MAX_CHARS) + '</a></h3>';
      if (item.content) {
        html += '<p class="feed-item-content">' + truncate(item.content, CONTENT_MAX_CHARS) + '</p>';
      }
      html += '<div class="feed-item-meta">';
      html += '<span class="feed-item-source">' + sourceLabel + '</span>';
      if (item.pubDate) html += '<span class="feed-item-date">' + formatDate(item.pubDate) + '</span>';
      html += '<a class="read-more" href="' + item.link + '" target="_blank" rel="noopener noreferrer">Read more</a>';
      html += '</div></div>';
    });

    container.innerHTML = html;
  }

  var safetyTimer = setTimeout(function () {
    container.innerHTML =
      '<div class="error">News feeds are taking too long to load. They may be temporarily unavailable.' +
      '<br><button class="retry-btn" onclick="location.reload()">Retry</button></div>';
  }, FETCH_TIMEOUT_MS + 5000);

  Promise.all(FEEDS.map(fetchFeed))
    .then(function (results) {
      clearTimeout(safetyTimer);
      var all = [].concat.apply([], results);
      all = all.filter(function (item) { return !isExcluded(item); });

      // Sort each source's items newest-first, then cap per source
      // so no single publication dominates the feed.
      var bySource = {};
      all.forEach(function (item) {
        var key = item.source || "unknown";
        if (!bySource[key]) bySource[key] = [];
        bySource[key].push(item);
      });

      var capped = [];
      Object.keys(bySource).forEach(function (key) {
        var sourceItems = bySource[key].sort(function (a, b) {
          return new Date(b.pubDate) - new Date(a.pubDate);
        });
        capped = capped.concat(sourceItems.slice(0, MAX_PER_SOURCE_DISPLAYED));
      });

      capped.sort(function (a, b) {
        return new Date(b.pubDate) - new Date(a.pubDate);
      });

      render(capped);
    })
    .catch(function (err) {
      clearTimeout(safetyTimer);
      console.error(err);
      container.innerHTML =
        '<div class="error">Unable to load news feeds right now.' +
        '<br><button class="retry-btn" onclick="location.reload()">Retry</button></div>';
    });
})();
</script>

</body>
</html>
